<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0F172A">
<title>DocMap</title>
<!-- DocMap 2026 (DM26) v10 — mobile page shown after scanning a binder QR.
     scan.html?q={short_code} · ?qr= · ?code={speaking_code} · <base>/q/{short_code} · #/q/{short_code}  [&lang=en]
     Works from file:// in the same browser as the desktop app (shared localStorage/IndexedDB),
     as a static upload in web mode (docmap.config.js, docs/DEPLOY-WEB.md) and later with the Python API (docs/API-CONTRACT.md).
     A server copy must also send security headers (CSP, HSTS, no-store): docs/SICUREZZA.md §5. -->
<script>
  /* Path routing (/studio-de/q/<short_code> rewritten to this page by .htaccess / nginx): make every relative
     URL below resolve from the app folder, not from /q/. Must run before any other relative resource. */
  (function(){ var m = location.pathname.match(/^(.*\/)q\/[^\/]+\/?$/); if (m && location.protocol !== 'file:'){ var b = document.createElement('base'); b.href = m[1]; document.head.appendChild(b); } })();
</script>
<script src="docmap.config.js"></script>
<link rel="stylesheet" href="assets/css-scan.css">
<link rel="stylesheet" href="assets/css-locations.css">
</head>
<body>
<div id="app" aria-live="polite"><main class="sc-main sc-center"><div class="sc-spin" aria-hidden="true"></div></main></div>
<noscript><div style="padding:24px;font-family:sans-serif">DocMap richiede JavaScript attivo. / DocMap requires JavaScript.</div></noscript>
<!-- Classic scripts (not modules) so the page works from file://. Order matters. -->
<script src="assets/js/02-core.js"></script>
<script src="assets/js/02c-locations.js"></script>
<script src="assets/js/10-auth.js"></script>
<script src="assets/js/11-scan.js"></script>
<script src="assets/js/11b-assoc.js"></script>
</body>
</html>
