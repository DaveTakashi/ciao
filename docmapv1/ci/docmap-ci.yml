# DocMap CI — source copy. GitHub only reads workflows from .github/workflows/ at the repository root: the active
# copy is .github/workflows/docmap-ci.yml (keep the two identical: tools/verifica-veloce.sh checks it).
# It only looks at docmapv1/ (the rest of the repository is not DocMap).
#
#   on every push / pull request touching docmapv1/  → "Verifica veloce" (~10 min): lint JS + Python, syntax, hub,
#        server Python, PHP ⇄ Python parity, zip check, installer, every fast Playwright test incl. unit + upgrade
#   every night at 02:30 UTC, or by hand (Actions › DocMap CI › Run workflow › full) → "Suite completa" (~40 min)
name: DocMap CI
on:
  push:
    paths: ['docmapv1/**', '.github/workflows/docmap-ci.yml']
  pull_request:
    paths: ['docmapv1/**', '.github/workflows/docmap-ci.yml']
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the full Playwright suite (~40 min)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: docmap-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PLAYWRIGHT_VERSION: '1.63.0'   # same as the agents' sandbox
  ESLINT_VERSION: '10.1.0'
jobs:
  fast:
    name: Verifica veloce
    runs-on: ubuntu-24.04      # pinned: a new Ubuntu can be ahead of Playwright's browser builds
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # diff_test.py and tests/upgrade.js read old releases from the git history
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: pdo_sqlite, openssl, sodium, mbstring }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Python packages
        run: pip install fastapi uvicorn cryptography pyftpdlib httpx pyflakes
      - name: Node packages (Playwright + Chromium, eslint)
        run: |
          npm install -g playwright@$PLAYWRIGHT_VERSION eslint@$ESLINT_VERSION pngjs jsqr
          npx -y playwright@$PLAYWRIGHT_VERSION install --with-deps chromium
      - name: Verifica veloce
        run: NODE_PATH=$(npm root -g) bash docmapv1/tools/verifica-veloce.sh
  full:
    name: Suite completa
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: ubuntu-24.04      # pinned: a new Ubuntu can be ahead of Playwright's browser builds
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: pdo_sqlite, openssl, sodium, mbstring }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install pypdfium2
      - run: |
          npm install -g playwright@$PLAYWRIGHT_VERSION pngjs jsqr
          npx -y playwright@$PLAYWRIGHT_VERSION install --with-deps chromium
      - run: cd docmapv1/tests && NODE_PATH=$(npm root -g) node suite.js
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: suite-shots, path: docmapv1/tests/shots, retention-days: 7 }
