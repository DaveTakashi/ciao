<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocMap 2026 — Phygital Archive &amp; Precision Label Studio</title>
<meta name="description" content="DocMap 2026 (DM26): archivio fisico-digitale, mappatura scaffali, stampa millimetrica di etichette con QR qr7.it, database SQLite locale. Funziona offline con doppio clic.">
<!-- Fonts load when online; the app falls back to system fonts offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/docmap.css">
<style id="page-style">@page{size:210mm 297mm;margin:0mm}</style>
</head>
<body>
<div id="banner-root"></div>
<header class="topbar"><div class="topbar-in" id="topbar"></div></header>
<main id="view"></main>
<div id="modal-root"></div>
<div id="help-root"></div>
<div id="guide-root"></div>
<div id="toasts"></div>
<div id="print-root"></div>
<input type="file" id="file-import" accept=".csv,.json,.txt,text/csv,application/json" class="hidden">
<input type="file" id="file-manifest" accept=".csv,.txt,text/csv" class="hidden">
<input type="file" id="file-restore" accept=".json,application/json" class="hidden">
<input type="file" id="file-sqlite" accept=".sqlite,.sqlite3,.db,application/x-sqlite3,application/vnd.sqlite3" class="hidden">
<noscript><div style="padding:40px;font-family:sans-serif">DocMap 2026 richiede JavaScript attivo. / DocMap 2026 requires JavaScript.</div></noscript>

<!-- Classic scripts (not modules) so everything runs from file:// with a double-click. Order matters. -->
<script src="vendor/sql-wasm.js"></script>
<script src="assets/js/01-qr.js"></script>
<script src="assets/js/02-core.js"></script>
<script src="assets/js/03-print.js"></script>
<script src="assets/js/04-ui.js"></script>
<script src="assets/js/05-views.js"></script>
<script src="assets/js/06-db.js"></script>
<script src="assets/js/07-help.js"></script>
<script src="assets/js/08-guide.js"></script>
<script src="assets/js/09-actions.js"></script>
</body>
</html>
