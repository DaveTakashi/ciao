<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocMap 2026 — Phygital Archive &amp; Precision Label Studio</title>
<meta name="description" content="DocMap 2026 (DM26): archivio fisico-digitale, mappatura scaffali e stampa millimetrica di etichette sdoppiate con QR qr7.it. File unico, funziona offline.">
<!-- Fonts: loaded when online; the app falls back to system fonts when offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   DocMap 2026 — Swiss Minimalist Design System (self-contained, no CDN)
   ===================================================================== */
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --text:#0F172A; --text-2:#334155;
  --muted:#64748B; --border:#E2E8F0; --border-2:#CBD5E1;
  --accent:#2563EB; --accent-2:#1D4ED8; --accent-weak:#EFF6FF; --accent-ring:rgba(37,99,235,.22);
  --green:#059669; --green-weak:#ECFDF5; --amber:#D97706; --amber-weak:#FFFBEB;
  --red:#DC2626; --red-weak:#FEF2F2; --violet:#7C3AED;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 1px 1px rgba(15,23,42,.03);
  --shadow-lg:0 24px 64px -16px rgba(15,23,42,.28),0 4px 12px rgba(15,23,42,.06);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-feature-settings:"zero" 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.hidden{display:none!important}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-lg svg.ic,svg.ic.lg{width:22px;height:22px}

/* ---------- Header ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1480px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:40px;height:40px;border-radius:10px;background:var(--text);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:-.02em;position:relative;overflow:hidden}
.brand-mark:after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.brand-t{font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1.1}
.brand-s{font-size:12px;color:var(--muted);line-height:1.2}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:center}
.nav button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:10px 14px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--text-2);cursor:pointer}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--text);color:#fff}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid}
.status .dot{width:8px;height:8px;border-radius:50%}
.status.ok{color:#047857;background:var(--green-weak);border-color:#A7F3D0}
.status.ok .dot{background:var(--green)}
.status.warn{color:#92400E;background:var(--amber-weak);border-color:#FCD34D}
.status.warn .dot{background:var(--amber);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,119,6,.55)}50%{box-shadow:0 0 0 6px rgba(217,119,6,0)}}
.lang{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.lang button{border:0;background:#fff;padding:8px 11px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--accent);color:#fff}
.banner{background:#FEF3C7;border-bottom:1px solid #FCD34D;color:#78350F;font-size:14px}
.banner .in{max-width:1480px;margin:0 auto;padding:10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ---------- Layout ---------- */
main{max-width:1480px;margin:0 auto;padding:24px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 0 20px;flex-wrap:wrap}
.page-h h1{font-size:28px;letter-spacing:-.03em;margin:0;font-weight:800;line-height:1.15}
.page-h p{margin:6px 0 0;color:var(--muted);max-width:760px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-p{padding:20px}
.card h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.card h3{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.card-sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.sep{height:1px;background:var(--border);margin:16px 0}
@media (max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr} main{padding:16px} .topbar-in{padding:10px 16px}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--border-2);background:#fff;color:var(--text);font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.nav button:focus-visible,.icon-btn:focus-visible{outline:none;box-shadow:0 0 0 4px var(--accent-ring)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-2)}
.btn-dark{background:var(--text);border-color:var(--text);color:#fff}
.btn-dark:hover{background:#1E293B}
.btn-amber{background:var(--amber);border-color:var(--amber);color:#fff}
.btn-amber:hover{background:#B45309}
.btn-danger{color:var(--red);border-color:#FECACA;background:#fff}
.btn-danger:hover{background:var(--red-weak)}
.btn-danger-solid{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger-solid:hover{background:#B91C1C}
.btn-ghost{border-color:transparent;background:transparent}
.btn-lg{min-height:54px;font-size:16px;padding:0 22px;border-radius:12px}
.btn-sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px}
.btn-block{width:100%}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:8px;cursor:pointer;color:var(--text-2)}
.icon-btn:hover{background:var(--surface-2);border-color:var(--border)}
.icon-btn.danger:hover{color:var(--red);background:var(--red-weak);border-color:#FECACA}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border-2);border-radius:10px;background:#fff;outline:none;transition:border-color .12s,box-shadow .12s}
textarea.inp{min-height:120px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-ring)}
.inp.mono{font-size:14px}
.inp.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.15)}
.hint{font-size:12.5px;color:var(--muted)}
.err-t{font-size:12.5px;color:var(--red);font-weight:600}
.chk{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;user-select:none}
.chk input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:10px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:7px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--text-2)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:32px;height:32px;border-radius:8px;border:2px solid #fff;box-shadow:0 0 0 1px var(--border-2);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--text)}
.greek{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.greek button{min-width:30px;height:28px;border:1px solid var(--border);background:#fff;border-radius:6px;font-family:var(--mono);cursor:pointer;font-size:13px}
.greek button:hover{border-color:var(--accent);color:var(--accent)}
.num{display:flex;align-items:center;gap:5px;min-width:0}
.num input[type=range]{flex:1;accent-color:var(--accent);min-width:0;width:100%}
.num .inp{width:68px;flex:none;min-height:36px;padding:6px 8px;text-align:right;font-family:var(--mono);font-size:13px}
.num .step{width:30px;height:32px;border:1px solid var(--border-2);background:#fff;border-radius:7px;cursor:pointer;font-weight:700}
.num .step:hover{background:var(--surface-2)}
.geo-row{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:10px;padding:5px 0}
.geo-row .lbl{font-size:11px}

/* ---------- Badges / chips ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--border);background:#fff;white-space:nowrap}
.b-current{color:#1E40AF;background:#EFF6FF;border-color:#BFDBFE}
.b-historical{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.b-out{color:#92400E;background:#FFFBEB;border-color:#FCD34D}
.b-new{color:#047857;background:#ECFDF5;border-color:#A7F3D0}
.b-upd{color:#1E40AF;background:#EFF6FF;border-color:#BFDBFE}
.b-err{color:#B91C1C;background:#FEF2F2;border-color:#FECACA}
.code-chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:-.01em}
.code-chip .bar{width:6px;height:22px;border-radius:3px}
.loc{font-family:var(--mono);font-weight:700;font-size:13.5px;background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:6px;white-space:nowrap}
.sc{font-family:var(--mono);font-size:12.5px;color:var(--text-2)}

/* ---------- Table ---------- */
.tbl-wrap{overflow:auto;border-top:1px solid var(--border)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{position:sticky;top:0;background:#F8FAFC;text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:hover td{background:#FAFCFF}
.tbl tr.sel td{background:#F5F9FF}
.tbl .co{font-weight:700}
.tbl .ti{color:var(--muted);font-size:13px}
.tbl .acts{white-space:nowrap;text-align:right}
.cnt-list{font-size:12.5px;color:var(--text-2);max-width:340px}
.cnt-list b{font-family:var(--mono);font-weight:700;color:var(--text)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px}
.search{position:relative;flex:1;min-width:240px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:40px}
.toolbar select.inp{width:auto;min-width:150px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.03em;font-family:var(--mono)}
.kpi .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* ---------- Spatial map ---------- */
.map-rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;padding:16px}
.room{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
.room-h{padding:10px 14px;background:var(--text);color:#fff;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.cab{padding:12px 14px;border-top:1px solid var(--border)}
.cab-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.shelf{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:3px solid #E2E8F0}
.shelf-l{font-family:var(--mono);font-weight:800;font-size:15px;color:var(--text-2)}
.shelf-b{display:flex;gap:6px;flex-wrap:wrap;min-height:44px;align-items:flex-end}
.spine{width:34px;height:60px;border-radius:3px 3px 0 0;color:#fff;font-family:var(--mono);font-weight:800;font-size:11px;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;box-shadow:inset -3px 0 0 rgba(0,0,0,.12)}
.spine.out{opacity:.35;outline:2px dashed var(--amber);outline-offset:-2px}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.48);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:720px;border:1px solid var(--border)}
.modal.xl{max-width:1240px}
.modal.lg{max-width:980px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-h h2{margin:0;font-size:19px;letter-spacing:-.02em}
.modal-b{padding:22px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);background:#FAFBFC;border-radius:0 0 16px 16px;flex-wrap:wrap}
.warn-box{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--amber-weak);border:1px solid #FCD34D;color:#78350F}
.danger-box{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--red-weak);border:1px solid #FECACA;color:#7F1D1D}
.info-box{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--accent-weak);border:1px solid #BFDBFE;color:#1E3A8A}
.edit-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px}
@media (max-width:980px){.edit-grid{grid-template-columns:1fr}}
.ci-row{display:grid;grid-template-columns:96px 1fr 36px;gap:8px;margin-bottom:8px}
.ci-row .inp{min-height:38px;padding:7px 10px}
.prev-box{background:repeating-linear-gradient(45deg,#F8FAFC,#F8FAFC 8px,#F1F5F9 8px,#F1F5F9 16px);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;align-items:center;overflow:hidden}
.prev-box .lbl-holder{background:#fff;box-shadow:0 6px 18px -6px rgba(15,23,42,.25);transform-origin:top left}

/* ---------- Toast ---------- */
#toasts{position:fixed;right:20px;bottom:20px;z-index:120;display:flex;flex-direction:column;gap:10px;max-width:min(440px,calc(100vw - 40px))}
.toast{background:var(--text);color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:flex-start;font-size:14px;animation:tin .18s ease-out}
.toast.ok svg{color:#34D399}.toast.err{background:#7F1D1D}.toast.warn svg{color:#FBBF24}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Print studio ---------- */
.studio{display:grid;grid-template-columns:420px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.studio{grid-template-columns:1fr}}
.panel-sec{padding:16px 18px;border-top:1px solid var(--border)}
.panel-sec:first-child{border-top:0}
.preset-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;padding-right:4px}
.preset{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;width:100%}
.preset:hover{border-color:var(--border-2);background:#FAFCFF}
.preset.on{border-color:var(--accent);background:var(--accent-weak);box-shadow:0 0 0 3px var(--accent-ring)}
.preset .pt{font-weight:700;font-size:13.5px;line-height:1.25}
.preset .pd{font-size:12px;color:var(--muted);font-family:var(--mono)}
.preset .pi{width:30px;height:42px;border:1px solid var(--border-2);border-radius:3px;flex:none;background:#fff;position:relative;overflow:hidden}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;font-size:13px;line-height:1.3}
.opt b{display:block;font-size:13.5px;margin-bottom:2px}
.opt span{color:var(--muted);font-size:12px}
.opt.on{border-color:var(--accent);background:var(--accent-weak);box-shadow:0 0 0 3px var(--accent-ring)}
.opt.full{grid-column:1/-1}
.slotmap-wrap{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
@media (max-width:560px){.slotmap-wrap{grid-template-columns:1fr}}
.slotmap{position:relative;width:100%;aspect-ratio:210/297;background:#fff;border:1px solid var(--border-2);border-radius:4px;box-shadow:0 4px 14px -6px rgba(15,23,42,.2)}
.slot{position:absolute;border:1px solid #93C5FD;background:#EFF6FF;color:#1E40AF;font-family:var(--mono);font-size:10px;font-weight:700;display:grid;place-items:center;cursor:pointer;padding:0;border-radius:2px;overflow:hidden}
.slot:hover{background:#DBEAFE}
.slot.used{background:repeating-linear-gradient(135deg,#E2E8F0,#E2E8F0 3px,#CBD5E1 3px,#CBD5E1 5px);border-color:#94A3B8;color:#64748B;text-decoration:line-through}
.slot.q{background:#2563EB;color:#fff;border-color:#1D4ED8}
.preview-pane{position:sticky;top:84px}
.preview-scroll{max-height:calc(100vh - 210px);overflow:auto;background:#E2E8F0;border-radius:0 0 12px 12px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:20px}
.sheet-holder{flex:none;box-shadow:0 10px 30px -10px rgba(15,23,42,.35);background:#fff;position:relative;overflow:hidden}
.sheet-holder .sheet{transform-origin:top left;position:absolute;left:0;top:0}
.sheet-cap{font-size:12px;color:var(--text-2);font-weight:600;font-family:var(--mono);margin-bottom:-12px}
.sum-line{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text-2)}
.sum-line b{font-family:var(--mono)}
.dropzone{border:2px dashed var(--border-2);border-radius:14px;padding:26px;text-align:center;background:#FAFCFF;cursor:pointer;transition:border-color .12s,background .12s}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-weak)}
.exp-card{display:flex;flex-direction:column;gap:12px}
.exp-n{width:34px;height:34px;border-radius:9px;background:var(--text);color:#fff;font-family:var(--mono);font-weight:800;display:grid;place-items:center;flex:none}
.codebox{font-family:var(--mono);font-size:12.5px;background:#0F172A;color:#E2E8F0;border-radius:10px;padding:14px;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto;line-height:1.5}
.kbd{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:5px}

/* =====================================================================
   LABEL / SHEET ENGINE — all geometry in millimetres
   ===================================================================== */
.sheet{width:210mm;height:296.8mm;position:relative;overflow:hidden;background:#fff;color:#0F172A;font-family:var(--font);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.slotbox{position:absolute;overflow:hidden;box-sizing:border-box}
.slotbox.cut{outline:0.2mm dashed #94A3B8;outline-offset:-0.1mm}
.slotbox.diecut-scr{box-shadow:inset 0 0 0 0.25mm #CBD5E1}
.slotbox.used-scr{background:repeating-linear-gradient(135deg,#F1F5F9 0 2mm,#E2E8F0 2mm 3mm)}
.slotbox.used-scr:after{content:attr(data-used);position:absolute;inset:0;display:grid;place-items:center;font:700 3mm var(--mono);color:#94A3B8}
.lab{position:absolute;inset:0;overflow:hidden;background:#fff;text-align:left;line-height:1.2}
.lab .spine-bar{position:absolute;left:0;top:0;bottom:0}
.lab .ln{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab .cl2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;line-height:1.1}
.lab .code{font-family:var(--mono);font-weight:800;letter-spacing:-.04em;line-height:.95}
.lab .lmono{font-family:var(--mono)}
.lab .qr{position:absolute;background:#fff}
.lab .qr svg{display:block;width:100%;height:100%}
.lab .ph-tick{position:absolute;width:22%;height:22%;border-color:rgba(15,23,42,.18);border-style:solid;border-width:0}
.calib-t{position:absolute;color:#CBD5E1;font-family:var(--mono);white-space:nowrap}

/* ---------- Register report ---------- */
.reg{font-family:var(--font);color:#0F172A;background:#fff}
.reg h1{font-size:18pt;margin:0;letter-spacing:-.02em}
.reg .rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5pt solid #0F172A;padding-bottom:3mm;margin-bottom:4mm}
.reg .rh .m{font-size:8.5pt;color:#475569;text-align:right;line-height:1.4}
.reg table{width:100%;border-collapse:collapse;font-size:8pt}
.reg th{text-align:left;font-size:6.8pt;text-transform:uppercase;letter-spacing:.06em;color:#475569;border-bottom:0.8pt solid #0F172A;padding:1.6mm 1.4mm}
.reg td{border-bottom:0.4pt solid #CBD5E1;padding:1.8mm 1.4mm;vertical-align:top}
.reg tr{break-inside:avoid;page-break-inside:avoid}
.reg .rc{font-family:var(--mono);font-weight:800;font-size:11pt;white-space:nowrap}
.reg .rl{font-family:var(--mono);font-weight:700;white-space:nowrap}
.reg .rq{width:18mm;height:18mm}
.reg .rq svg{width:18mm;height:18mm;display:block}
.reg .ru{font-family:var(--mono);font-size:7pt;word-break:break-all;color:#1D4ED8;text-decoration:none}
.reg ul{margin:0;padding-left:3.5mm}
.reg li{margin:0 0 .4mm}
.reg .foot{margin-top:5mm;font-size:7pt;color:#64748B;display:flex;justify-content:space-between}
.reg-screen{background:#E2E8F0;padding:20px;border-radius:12px;max-height:68vh;overflow:auto}
.reg-screen .reg{width:190mm;margin:0 auto;padding:10mm;box-shadow:0 10px 30px -10px rgba(15,23,42,.35)}

/* ---------- Print ---------- */
#print-root{display:none}
@media print{
  html,body{background:#fff!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
  #print-root .sheet{page-break-after:always;break-after:page;margin:0}
  #print-root .sheet:last-child{page-break-after:auto;break-after:auto}
  #print-root .reg{width:auto;padding:0;box-shadow:none}
  #print-root .reg thead{display:table-header-group}
  .slotbox.diecut-scr{box-shadow:none}
}

<script>
/* =====================================================================
   DM26 QR — embedded pure-JS QR Code Model 2 encoder → SVG (offline)
   Byte mode (UTF-8), versions 1–40, ECC L/M/Q/H, automatic mask choice.
   Algorithm follows ISO/IEC 18004.
   ===================================================================== */
const DMQR = (() => {
  const ECC_PER_BLOCK = {
    L:[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    M:[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    Q:[-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    H:[-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30]
  };
  const NUM_BLOCKS = {
    L:[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    M:[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    Q:[-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    H:[-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]
  };
  const FORMAT_BITS = {L:1, M:0, Q:3, H:2};

  function gfMul(x, y){ let z = 0; for (let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 0xFF; }
  function rsDivisor(degree){
    const r = new Array(degree).fill(0); r[degree-1] = 1; let root = 1;
    for (let i = 0; i < degree; i++){
      for (let j = 0; j < r.length; j++){ r[j] = gfMul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j+1]; }
      root = gfMul(root, 0x02);
    }
    return r;
  }
  function rsRemainder(data, div){
    const r = div.map(() => 0);
    for (const b of data){ const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= gfMul(c, f); }); }
    return r;
  }
  function rawModules(v){
    let r = (16 * v + 128) * v + 64;
    if (v >= 2){ const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  }
  function dataCodewords(v, ecl){ return Math.floor(rawModules(v) / 8) - ECC_PER_BLOCK[ecl][v] * NUM_BLOCKS[ecl][v]; }
  function alignPositions(v){
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2, size = v * 4 + 17;
    const step = (v === 32) ? 26 : Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
    const res = [6];
    for (let pos = size - 7; res.length < n; pos -= step) res.splice(1, 0, pos);
    return res;
  }
  function utf8(str){
    if (typeof TextEncoder !== 'undefined') return Array.from(new TextEncoder().encode(str));
    return Array.from(unescape(encodeURIComponent(str))).map(c => c.charCodeAt(0));
  }

  function encode(text, ecl){
    ecl = FORMAT_BITS.hasOwnProperty(ecl) ? ecl : 'M';
    const data = utf8(String(text));
    let ver = 1, ccBits = 8;
    for (; ver <= 40; ver++){
      ccBits = ver <= 9 ? 8 : 16;
      if (4 + ccBits + data.length * 8 <= dataCodewords(ver, ecl) * 8) break;
    }
    if (ver > 40) throw new Error('QR: data too long');
    const capBits = dataCodewords(ver, ecl) * 8;
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(0x4, 4); put(data.length, ccBits); data.forEach(b => put(b, 8));
    put(0, Math.min(4, capBits - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let pad = 0xEC; bits.length < capBits; pad ^= 0xEC ^ 0x11) put(pad, 8);
    const cw = [];
    for (let i = 0; i < bits.length; i += 8){ let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; cw.push(b); }

    // Error correction + interleaving
    const nBlocks = NUM_BLOCKS[ecl][ver], eccLen = ECC_PER_BLOCK[ecl][ver];
    const rawCw = Math.floor(rawModules(ver) / 8);
    const nShort = nBlocks - rawCw % nBlocks, shortLen = Math.floor(rawCw / nBlocks);
    const div = rsDivisor(eccLen), blocks = [];
    for (let i = 0, k = 0; i < nBlocks; i++){
      const dat = cw.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1)); k += dat.length;
      const ecc = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++)
      blocks.forEach((blk, j) => { if (i !== shortLen - eccLen || j >= nShort) all.push(blk[i]); });

    // Matrix
    const size = ver * 4 + 17;
    const M = Array.from({length:size}, () => new Array(size).fill(false));
    const F = Array.from({length:size}, () => new Array(size).fill(false));
    const setF = (x, y, d) => { M[y][x] = d; F[y][x] = true; };
    for (let i = 0; i < size; i++){ setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setF(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const ap = alignPositions(ver), na = ap.length;
    for (let i = 0; i < na; i++) for (let j = 0; j < na; j++){
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
        setF(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = (mask) => {
      const d = (FORMAT_BITS[ecl] << 3) | mask; let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((d << 10) | rem) ^ 0x5412, bit = i => ((b >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) setF(8, i, bit(i));
      setF(8, 7, bit(6)); setF(8, 8, bit(7)); setF(7, 8, bit(8));
      for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(i));
      setF(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7){
      let rem = ver; for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const b = (ver << 12) | rem;
      for (let i = 0; i < 18; i++){
        const bit = ((b >>> i) & 1) !== 0, a = size - 11 + i % 3, c = Math.floor(i / 3);
        setF(a, c, bit); setF(c, a, bit);
      }
    }
    // Codewords (zig-zag)
    let bi = 0;
    for (let right = size - 1; right >= 1; right -= 2){
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++){
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!F[y][x] && bi < all.length * 8){ M[y][x] = ((all[bi >>> 3] >>> (7 - (bi & 7))) & 1) !== 0; bi++; }
      }
    }
    const maskFn = [
      (x,y) => (x + y) % 2 === 0, (x,y) => y % 2 === 0, (x,y) => x % 3 === 0, (x,y) => (x + y) % 3 === 0,
      (x,y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x,y) => x * y % 2 + x * y % 3 === 0,
      (x,y) => (x * y % 2 + x * y % 3) % 2 === 0, (x,y) => ((x + y) % 2 + x * y % 3) % 2 === 0
    ];
    const applyMask = (m) => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && maskFn[m](x, y)) M[y][x] = !M[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      const line = (get) => {
        for (let a = 0; a < size; a++){
          let run = 1, s = '';
          for (let b = 0; b < size; b++){
            const v = get(a, b); s += v ? '1' : '0';
            if (b > 0){ if (v === get(a, b - 1)){ run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; }
          }
          s = '0000' + s + '0000';
          let idx = s.indexOf('1011101');
          while (idx !== -1){
            if (s.substr(idx - 4, 4) === '0000' || s.substr(idx + 7, 4) === '0000') p += 40;
            idx = s.indexOf('1011101', idx + 1);
          }
        }
      };
      line((a, b) => M[a][b]); line((a, b) => M[b][a]);
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++){
        const c = M[y][x]; if (c === M[y][x+1] && c === M[y+1][x] && c === M[y+1][x+1]) p += 3;
      }
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (M[y][x]) dark++;
      const total = size * size, k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
      return p + Math.max(0, k) * 10;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++){
      applyMask(m); drawFormat(m);
      const pn = penalty(); if (pn < bestP){ bestP = pn; best = m; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);
    return { size, modules: M, version: ver, mask: best, ecl };
  }

  const cache = new Map();
  function svg(text, opts){
    opts = opts || {};
    const ecl = opts.ecl || 'M', quiet = opts.quiet == null ? 4 : opts.quiet, fg = opts.fg || '#0F172A';
    const key = text + '|' + ecl + '|' + quiet + '|' + fg;
    if (cache.has(key)) return cache.get(key);
    const q = encode(text, ecl), n = q.size + quiet * 2;
    let d = '';
    for (let y = 0; y < q.size; y++){
      let x = 0;
      while (x < q.size){
        if (q.modules[y][x]){ let s = x; while (x < q.size && q.modules[y][x]) x++; d += 'M' + (s + quiet) + ' ' + (y + quiet) + 'h' + (x - s) + 'v1h-' + (x - s) + 'z'; }
        else x++;
      }
    }
    const out = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" role="img" aria-label="QR ' + String(text).replace(/[<>&"]/g, '') + '"><rect width="' + n + '" height="' + n + '" fill="#fff"/><path fill="' + fg + '" d="' + d + '"/></svg>';
    if (cache.size > 600) cache.clear();
    cache.set(key, out);
    return out;
  }
  return { encode, svg };
})();
</script>

function t(key, vars){
  const lang = (typeof S !== 'undefined' && S && S.lang) || 'it';
  let s = (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key] : (I18N.it[key] !== undefined ? I18N.it[key] : key);
  if (vars && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (m, k) => vars[k] !== undefined ? vars[k] : m);
  return s;
}

/* ---------------- utils ---------------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const r1 = (n) => Math.round(n * 100) / 100;
const fmtMM = (n) => (Math.round(n * 100) / 100).toFixed(Math.abs(n * 10 - Math.round(n * 10)) < 1e-9 ? 1 : 2);
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => b[i] = Math.random() * 256 | 0);
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
function randChars(n){
  const out = []; const buf = new Uint32Array(n * 2);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(buf); else for (let i = 0; i < buf.length; i++) buf[i] = Math.random() * 4294967296;
  for (let i = 0; out.length < n; i++){
    const v = buf[i % buf.length] >>> 0;
    const lim = 4294967296 - (4294967296 % SC_ALPHABET.length);
    if (v < lim || i >= buf.length) out.push(SC_ALPHABET[v % SC_ALPHABET.length]);
  }
  return out.join('');
}
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso, withTime){
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const loc = S.lang === 'en' ? 'en-GB' : 'it-IT';
  return withTime ? d.toLocaleString(loc, {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString(loc, {day:'2-digit',month:'2-digit',year:'numeric'});
}
function slugify(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/s\.?\s?r\.?\s?l\.?|s\.?\s?p\.?\s?a\.?|s\.?\s?n\.?\s?c\.?|s\.?\s?a\.?\s?s\.?/g, ' ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
function naturalCmp(a, b){ return String(a).localeCompare(String(b), undefined, {numeric:true, sensitivity:'base'}); }
function normHex(c){
  if (!c) return '';
  let s = String(c).trim(); if (!s.startsWith('#')) s = '#' + s;
  if (/^#[0-9a-fA-F]{3}$/.test(s)) s = '#' + s.slice(1).split('').map(x => x + x).join('');
  return /^#[0-9a-fA-F]{6}$/.test(s) ? s.toUpperCase() : '';
}

/* ---------------- Binder helpers ---------------- */
function computeLocation(b){
  const head = String(b.room_code || '').trim() + String(b.cabinet_code || '').trim();
  return [head, String(b.shelf_code || '').trim(), String(b.sector_code || '').trim()].filter(Boolean).join('-');
}
function parseLocation(code){
  const s = String(code || '').trim(); if (!s) return null;
  const m = s.match(/^([A-Za-z]*)(\d*)-([^-]+)(?:-(.+))?$/);
  if (!m) return null;
  return { room_code:m[1] || '', cabinet_code:m[2] || '', shelf_code:m[3] || '', sector_code:m[4] || '' };

function contentsToPipe(items){ return (items || []).map(i => (i.year ? i.year + ': ' : '') + (i.description || '')).filter(x => x.trim()).join('|'); }

        '<div style="margin-top:auto">' + metaLine(b, fm) + '</div></div></div>';
    const ly = y0 + th1 + Math.max(0.8, fco * 0.25);
    const lw = portrait ? (q ? iw - q - gap : iw) : tw;
    const lh = ih - th1 - Math.max(0.8, fco * 0.25) - fm * 1.5;
    html += contentsBlock(b.contents_items, x0, ly, lw, lh, Math.min(fco * 0.82, 4.2));
    html += '<div class="ln" style="position:absolute;left:' + MM(x0) + ';width:' + MM(lw) + ';top:' + MM(y0 + ih - fm * 1.35) + ';font-size:' + MM(fm * 0.85) + ';color:#64748B">' + esc(t('l_updated')) + ' ' + esc(fmtDate(b.updated_at)) + ' · <span class="lmono">' + esc(b.short_code) + '</span></div>';
  }
  return html + '</div>';
}

/* ---------------- Queue & layout ---------------- */
function printQueueBinders(){
  return S.binders.filter(b => b.selected_for_print).sort((a, b) => naturalCmp(a.speaking_code, b.speaking_code));
}
function queueItems(){
  const P = S.print, out = [];
  const copies = clamp(parseInt(P.copies, 10) || 1, 1, 50);
  const kinds = P.contentMode === 'pair' ? ['A','B'] : P.contentMode === 'a' ? ['A'] : P.contentMode === 'b' ? ['B'] : ['U'];
  printQueueBinders().forEach(b => { for (let c = 0; c < copies; c++) kinds.forEach(k => out.push({kind:k, b})); });
  return out;
}
function slotCount(){ const g = S.print.geometry; return Math.max(1, (g.cols | 0) * (g.rows | 0)); }
function usedSet(){ const N = slotCount(); return new Set((S.usedSlots[S.print.presetId] || []).filter(i => i >= 0 && i < N)); }
function slotRect(i){
  const g = S.print.geometry, c = i % g.cols, r = Math.floor(i / g.cols);
  return { r, c, x: g.marginLeft + c * (g.w + g.gapX), y: g.marginTop + r * (g.h + g.gapY) };
}
function layoutLabels(){
  const items = queueItems(), N = slotCount(), used = usedSet(), pages = [];
  let idx = 0, p = 0;
  while (idx < items.length && p < 500){
    const slots = [];
    for (let s = 0; s < N && idx < items.length; s++){
      if (p === 0 && used.has(s)) continue;
      slots.push({s, item:items[idx++]});
    }
    if (slots.length || p > 0) pages.push(slots);
    p++;
  }
  return { pages, items:items.length, skipped: items.length ? used.size : 0, used };
}

/* ---------------- Sheets ---------------- */
function sheetWrap(inner){
  const P = S.print;
  return '<div class="sheet"><div style="position:absolute;left:' + MM(+P.offsetX || 0) + ';top:' + MM(+P.offsetY || 0) + ';width:210mm;height:297mm">' + inner + '</div></div>';
}
function buildLabelSheets(screen){
  const g = S.print.geometry, P = S.print, L = layoutLabels(), N = slotCount();
  const pages = L.pages.length ? L.pages : (screen ? [[]] : []);
  return pages.map((slots, pi) => {
    let inner = '';
    const filled = new Map(slots.map(x => [x.s, x.item]));
    for (let s = 0; s < N; s++){
      const R = slotRect(s), item = filled.get(s);
      const isUsed = pi === 0 && L.used.has(s);
      const cls = ['slotbox'];
      if (g.cut) cls.push('cut');
      if (screen && !g.cut) cls.push('diecut-scr');
      if (screen && isUsed) cls.push('used-scr');
      if (!item && !screen && !g.cut) continue;
      inner += '<div class="' + cls.join(' ') + '" data-used="#' + (s + 1) + '" style="left:' + MM(R.x) + ';top:' + MM(R.y) + ';width:' + MM(g.w) + ';height:' + MM(g.h) + ';' + (g.radius ? 'border-radius:' + MM(g.radius) + ';' : '') + '">' +
        (item ? renderLabel(item.kind, item.b, g, P) : '') + '</div>';
    }
    return sheetWrap(inner);
  });
}
function buildCalibSheet(){
  const g = S.print.geometry, P = S.print, N = slotCount(), used = usedSet();
  const HL = '#D1D5DB', TX = '#CBD5E1', LW = 0.09; // 0.25pt ≈ 0.088mm
  const line = (x, y, w, h, c) => '<div style="position:absolute;left:' + MM(x) + ';top:' + MM(y) + ';width:' + MM(w) + ';height:' + MM(h) + ';background:' + (c || HL) + '"></div>';
  const cross = (cx, cy, L) => line(cx - L / 2, cy - LW / 2, L, LW) + line(cx - LW / 2, cy - L / 2, LW, L);
  let inner = '';
  const preset = findPreset(P.presetId);
  const ox = +P.offsetX || 0, oy = +P.offsetY || 0;
  const head = 'DocMap 2026 • ' + (S.lang === 'en' ? 'CALIBRATION TEST' : 'PROVA DI CALIBRAZIONE') + ' • ' + preset.name + (S.print.geometryModified ? ' (' + t('g_modified') + ')' : '') + ' • Offset X ' + fmtMM(ox) + ' / Y ' + fmtMM(oy) + ' mm • ↑ ALTO / TOP ↑';
  inner += '<div class="calib-t" style="left:0;width:210mm;top:3.2mm;text-align:center;font-size:1.9mm">' + esc(head) + '</div>';
  [[5,5],[205,5],[5,292],[205,292],[105,148.5]].forEach(([x, y]) => { inner += cross(x, y, 6); });
  // 50 mm scale bar (verifies 100% scale)
  const bx = 80, by = 293.2;
  inner += line(bx, by, 50, LW);
  for (let i = 0; i <= 10; i++) inner += line(bx + i * 5 - LW / 2, by - (i % 2 ? 0.8 : 1.6), LW, i % 2 ? 0.8 : 1.6);
  inner += '<div class="calib-t" style="left:' + MM(bx + 52) + ';top:' + MM(by - 1.6) + ';font-size:1.6mm">50 mm — ' + (S.lang === 'en' ? 'check scale 100%' : 'verifica scala 100%') + '</div>';
  for (let s = 0; s < N; s++){
    const R = slotRect(s), w = g.w, h = g.h;
    const txt = 'Slot #' + (s + 1) + ' (R' + (R.r + 1) + '-C' + (R.c + 1) + ') • ↑ ALTO / TOP ↑ • [X: ' + fmtMM(R.x + ox) + 'mm, Y: ' + fmtMM(R.y + oy) + 'mm]' + (used.has(s) ? ' • ' + t('sl_used') : '');
    const fs = clamp((w - 4) / (txt.length * 0.6), 1.1, 1.9);
    let si = '<div style="position:absolute;inset:0;border:' + MM(LW) + ' solid ' + HL + ';' + (g.radius ? 'border-radius:' + MM(g.radius) + ';' : '') + '"></div>';
    const k = Math.min(3, Math.min(w, h) * 0.12), m = 1.5;
    // corner L marks
    si += line(m, m, k, LW) + line(m, m, LW, k);
    si += line(w - m - k, m, k, LW) + line(w - m - LW, m, LW, k);
    si += line(m, h - m - LW, k, LW) + line(m, h - m - k, LW, k);
    si += line(w - m - k, h - m - LW, k, LW) + line(w - m - LW, h - m - k, LW, k);
    // centre crosshair + square
    const cx = w / 2, cy = h / 2, L = Math.min(8, Math.min(w, h) * 0.25), sq = Math.min(2.4, L * 0.3);
    si += cross(cx, cy, L);
    si += '<div style="position:absolute;left:' + MM(cx - sq / 2) + ';top:' + MM(cy - sq / 2) + ';width:' + MM(sq) + ';height:' + MM(sq) + ';border:' + MM(LW) + ' solid ' + HL + '"></div>';
    si += '<div class="calib-t" style="left:0;width:' + MM(w) + ';top:' + MM(m + k + 0.3) + ';text-align:center;font-size:' + MM(fs) + '">' + esc(txt) + '</div>';
    si += '<div class="calib-t" style="left:0;width:' + MM(w) + ';top:' + MM(cy - L / 2 - Math.min(5, h * 0.14) - 0.5) + ';text-align:center;font-size:' + MM(Math.min(5, h * 0.14)) + ';color:#E2E8F0;line-height:1">↑</div>';
    si += '<div class="calib-t" style="left:0;width:' + MM(w) + ';top:' + MM(h - m - fs * 1.6) + ';text-align:center;font-size:' + MM(fs * 0.9) + '">' + fmtMM(w) + ' × ' + fmtMM(h) + ' mm</div>';
    inner += '<div class="slotbox" style="left:' + MM(R.x) + ';top:' + MM(R.y) + ';width:' + MM(w) + ';height:' + MM(h) + '">' + si + '</div>';
  }
  return sheetWrap(inner);
}

    '<table><thead><tr><th style="width:15mm">' + c[0] + '</th><th style="width:17mm">' + c[1] + '</th><th>' + c[2] + '</th><th>' + c[3] + '</th><th style="width:19mm">' + c[4] + '</th><th style="width:21mm">' + c[5] + '</th><th style="width:28mm">' + c[6] + '</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="foot"><span>DocMap 2026 — Phygital Archive & Precision Label Studio</span><span>' + esc(S.settings.studioName) + '</span></div></div>';

/* ---------------- Print driver ---------------- */
function doPrint(kind, html){
  const ps = $('#page-style');
  ps.textContent = kind === 'register' ? '@page{size:210mm 297mm;margin:10mm 10mm 12mm 10mm}' : '@page{size:210mm 297mm;margin:0mm}';
  const root = $('#print-root');
  root.innerHTML = html;
  const cleanup = () => { root.innerHTML = ''; ps.textContent = '@page{size:210mm 297mm;margin:0mm}'; window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  // allow layout before opening the dialog
  return new Promise(res => setTimeout(() => { try { window.print(); } finally { setTimeout(() => { cleanup(); res(); }, 300); } }, 60));
}
async function printLabels(){
  const L = layoutLabels();
  if (!L.items){ toast(t('pr_none'), 'warn'); return; }
  await doPrint('labels', buildLabelSheets(false).join(''));
  // Offer to update the partial-sheet map with the consumed slots of the last sheet
  const N = slotCount();
  const last = L.pages[L.pages.length - 1] || [];
  const base = L.pages.length === 1 ? new Set(L.used) : new Set();
  last.forEach(x => base.add(x.s));
  const full = base.size >= N;
  let nextFree = 1; for (let i = 0; i < N; i++){ if (!base.has(i)){ nextFree = i + 1; break; } }
  openModal({
    title: t('after_print_t'),
    body: '<p style="margin:0">' + (full ? esc(t('after_print_full')) : esc(t('after_print_p', {n:last.length, s:nextFree}))) + '</p>',
    buttons: [
      {label:t('no_thanks'), cls:'btn', action:'modal-close'},
      {label:t('yes_update'), cls:'btn btn-primary', icon:'check', fn: () => {
        S.usedSlots[S.print.presetId] = full ? [] : Array.from(base).sort((a, b) => a - b);
        savePrefs(); closeModal(); if (S.view === 'print') renderView();
      }}
    ]
  });
}
function printCalibration(){ doPrint('calib', buildCalibSheet()); }
function printRegister(list){ doPrint('register', buildRegisterHTML(list)); }

const ic = (n, cls) => '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || '') + '</svg>';

function toast(msg, kind, ms){
  kind = kind || 'ok';

  el.className = 'toast ' + kind;
  el.setAttribute('role', 'status');
  el.innerHTML = ic(kind === 'ok' ? 'check' : kind === 'err' ? 'alert' : kind === 'warn' ? 'alert' : 'info') + '<div>' + esc(msg) + '</div>';

/* Modal stack: each modal is its own overlay so a confirmation can sit above an editor. */
const modalStack = [];
function openModal(o){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
  ov.style.zIndex = 80 + modalStack.length * 5;
  const btns = (o.buttons || []).map((b, i) => '<button class="' + (b.cls || 'btn') + '" data-a="modal-btn" data-i="' + i + '">' + (b.icon ? ic(b.icon) : '') + esc(b.label) + '</button>').join('');
  ov.innerHTML = '<div class="modal ' + (o.size || '') + '"><div class="modal-h"><h2>' + esc(o.title || '') + '</h2><button class="icon-btn" data-a="modal-close" aria-label="' + esc(t('close')) + '">' + ic('x') + '</button></div>' +
    '<div class="modal-b">' + (o.body || '') + '</div>' + (btns ? '<div class="modal-f">' + btns + '</div>' : '') + '</div>';
  ov._opts = o;
  ov.addEventListener('mousedown', (e) => { if (e.target === ov && o.dismissable !== false) closeModal(); });
  $('#modal-root').appendChild(ov);
  modalStack.push(ov);
  if (o.onMount) o.onMount(ov);
  const first = ov.querySelector('input,select,textarea,.btn-primary,.btn-danger-solid');
  if (first && o.autofocus !== false) setTimeout(() => first.focus(), 30);
  return ov;
}
function closeModal(){
  const ov = modalStack.pop();
  if (!ov) return;
  if (ov._opts && ov._opts.onClose) ov._opts.onClose();
  ov.remove();
}
function topModal(){ return modalStack[modalStack.length - 1]; }

/** Every destructive action passes through here. */
function confirmAction(o){
  const body = '<div class="stack"><div class="' + (o.danger ? 'danger-box' : 'warn-box') + '">' + ic('alert', 'lg') + '<div><b>' + esc(t('c_text')) + '</b>' + (o.detail ? '<div style="margin-top:6px">' + esc(o.detail) + '</div>' : '') + '</div></div>' +
    (S.hasUnexportedChanges ? '<div class="info-box">' + ic('info') + '<div class="small">' + esc(t('c_dirty')) + '<div style="margin-top:10px"><button class="btn btn-sm btn-amber" data-a="quick-backup">' + ic('save') + esc(t('quick_backup')) + '</button></div></div></div>' : '') + '</div>';
  openModal({
    title: o.title || t('c_title'), body,
    buttons: [
      {label:t('cancel'), cls:'btn', action:'modal-close'},
      {label:o.okLabel || t('confirm'), cls:o.danger ? 'btn btn-danger-solid' : 'btn btn-primary', icon:o.danger ? 'trash' : 'check', fn: () => { closeModal(); o.onOk && o.onOk(); }}
    ]
  });
}

function download(name, text, mime){
  const blob = new Blob([text], {type:(mime || 'text/plain') + ';charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function copyText(text){
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext !== false){ await navigator.clipboard.writeText(text); ok = true; } } catch(e){}
  if (!ok){
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    ta.remove();
  }
  toast(ok ? t('copied') : t('copy_fail'), ok ? 'ok' : 'warn');
  return ok;
}
function readFileText(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result || '')); r.onerror = () => rej(r.error); r.readAsText(file, 'utf-8'); });
}

/* =====================================================================
   CSV
   ===================================================================== */
function detectDelim(text){
  const first = (String(text).split(/\r?\n/).find(l => l.trim()) || '');
  const cnt = (ch) => { let n = 0, q = false; for (const c of first){ if (c === '"') q = !q; else if (!q && c === ch) n++; } return n; };
  const c = {';':cnt(';'), ',':cnt(','), '\t':cnt('\t')};
  const best = Object.keys(c).sort((a, b) => c[b] - c[a])[0];
  return c[best] > 0 ? best : ';';
}
function parseCSV(text, delim){
  const rows = []; let row = [], f = '', q = false, i = 0;
  const s = String(text).replace(/^﻿/, '');
  while (i < s.length){
    const c = s[i];
    if (q){
      if (c === '"'){ if (s[i + 1] === '"'){ f += '"'; i += 2; continue; } q = false; i++; continue; }
      f += c; i++; continue;
    }
    if (c === '"' && f === ''){ q = true; i++; continue; }
    if (c === delim){ row.push(f); f = ''; i++; continue; }
    if (c === '\r'){ i++; continue; }
    if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; i++; continue; }
    f += c; i++;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function csvField(v, delim){
  const s = String(v == null ? '' : v);
  return (s.includes(delim) || s.includes('"') || s.includes('\n') || s.includes('\r')) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(rows, delim){ return rows.map(r => r.map(v => csvField(v, delim)).join(delim)).join('\r\n') + '\r\n'; }

const HEADER_ALIASES = {
  speaking_code:['speaking_code','codice_parlante','codice','code','speaking','cod'],
  company_name:['company_name','cliente','client','company','ragione_sociale','azienda','nome_cliente'],
  category:['category','categoria','pratica'],
  binder_title:['binder_title','titolo','title','titolo_faldone','faldone','descrizione_faldone','oggetto'],
  room_code:['room_code','stanza','room','zona','zone'],
  cabinet_code:['cabinet_code','armadio','cabinet','mobile'],
  shelf_code:['shelf_code','ripiano','shelf','mensola'],
  sector_code:['sector_code','settore','sector','lato'],
  location_code:['location_code','posizione','location','coordinata','coordinate','collocazione'],
  archive_state:['archive_state','stato','state','status','stato_archivio'],
  contents_items:['contents','contents_items','contenuti','contenuto','documenti','items'],
  tags:['tags','tag','parole_chiave','keywords'],
  color_hex:['color_hex','colore','color','colour'],
  short_code:['short_code','shortcode','codice_qr','qr_code','qr'],
  short_url:['short_url','shorturl','url_breve','link'],
  final_destination:['final_destination','destinazione','destination','url_destinazione'],
  selected_for_print:['selected_for_print','stampa','print','selezionato'],
  id:['id','uuid'],
  updated_at:['updated_at','aggiornato','data_aggiornamento']
};
const ALIAS_LOOKUP = (() => { const m = {}; Object.keys(HEADER_ALIASES).forEach(k => HEADER_ALIASES[k].forEach(a => m[a] = k)); return m; })();
const normHeader = (h) => String(h || '').replace(/^﻿/, '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
function normState(v){
  const s = String(v || '').trim().toLowerCase().replace(/[\s\-\/]+/g, '_');
  if (!s) return '';
  if (/^(historical|storico|archivio_storico|hist|deposito)$/.test(s)) return 'HISTORICAL';
  if (/^(checked_out|checkedout|out|prelevato|in_uso|inuso|in_uso_prelevato|fuori)$/.test(s) || s.indexOf('preleva') >= 0) return 'CHECKED_OUT';
  if (/^(current|corrente|archivio_corrente|attivo|active)$/.test(s)) return 'CURRENT';
  return STATES.includes(String(v).toUpperCase()) ? String(v).toUpperCase() : 'CURRENT';
}
function truthy(v){ return /^(1|true|si|sì|yes|y|x|vero)$/i.test(String(v || '').trim()); }

/* Turn one raw record (any header naming) into a partial binder containing only provided fields. */
function mapRecord(raw){
  const o = {};
  Object.keys(raw || {}).forEach(k => {
    const key = ALIAS_LOOKUP[normHeader(k)] || (HEADER_ALIASES[k] ? k : null);
    if (!key) return;
    const v = raw[k];
    if (v == null) return;
    if (key === 'contents_items'){
      const arr = pipeToContents(v);
      if (arr.length) o.contents_items = arr;
      return;
    }
    if (key === 'selected_for_print'){ if (String(v).trim() !== '' || typeof v === 'boolean') o.selected_for_print = typeof v === 'boolean' ? v : truthy(v); return; }
    const s = String(v).trim();
    if (s !== '') o[key] = s;
  });
  if (o.archive_state) o.archive_state = normState(o.archive_state);
  if (o.speaking_code) o.speaking_code = o.speaking_code.toUpperCase().replace(/\s+/g, '');
  if (!o.room_code && !o.cabinet_code && !o.shelf_code && o.location_code){
    const p = parseLocation(o.location_code); if (p) Object.keys(p).forEach(k => { if (p[k]) o[k] = p[k]; });
  }
  delete o.location_code;
  if (!o.short_code && o.short_url){ const m = o.short_url.match(/dm26[A-Za-z0-9]{8}/); if (m) o.short_code = m[0]; }
  delete o.short_url;
  return o;
}

/* ---------------- Export builders ---------------- */
function binderToCsvRow(b){
  return [b.speaking_code, b.company_name, b.category, b.binder_title, b.room_code, b.cabinet_code, b.shelf_code, b.sector_code, b.location_code, b.archive_state,
    contentsToPipe(b.contents_items), b.tags, b.color_hex, b.short_code, b.short_url, destFor(b), b.selected_for_print ? '1' : '0', b.id, b.updated_at];
}
function sortedBinders(){ return S.binders.slice().sort((a, b) => naturalCmp(a.speaking_code, b.speaking_code)); }
function manifestRow(b){ return [b.short_code, b.short_url, destFor(b), manifestTags(b)]; }
const MANIFEST_HEADER = ['short_code','short_url','final_destination','tags'];
function exportManifest(){
  const rows = [MANIFEST_HEADER].concat(sortedBinders().filter(b => b.short_code).map(manifestRow));
  const name = 'manifest_qr7_dm26.csv';
  download(name, toCSV(rows, ';').replace(/\r\n/g, '\n'), 'text/csv');
  markExported(name); toast(t('ex_done', {f:name}));
}
function mergeManifest(text, prune){
  const bom = text.charCodeAt(0) === 0xFEFF;
  let src = bom ? text.slice(1) : text;
  const eol = src.indexOf('\r\n') >= 0 ? '\r\n' : '\n';
  const lines = src.split(/\r?\n/);
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  let header = lines.length ? lines[0] : MANIFEST_HEADER.join(';');
  let delim = ';';
  let cols = parseCSV(header, delim)[0] || [];
  if (cols.length < 2){ const d = detectDelim(header); if (d !== ';'){ delim = d; cols = parseCSV(header, delim)[0] || []; } }
  let normCols = cols.map(normHeader);
  let body = lines.slice(1);
  if (!normCols.includes('short_code')){
    // file without a header: keep all lines, use the standard header
    body = lines.slice(0); header = MANIFEST_HEADER.join(delim); normCols = MANIFEST_HEADER.slice();
  }
  const sIdx = Math.max(0, normCols.indexOf('short_code'));
  const ours = new Map();
  sortedBinders().filter(b => b.short_code).forEach(b => {
    const val = {short_code:b.short_code, short_url:b.short_url, final_destination:destFor(b), tags:manifestTags(b)};
    ours.set(b.short_code, normCols.map(c => csvField(val[c] != null ? val[c] : '', delim)).join(delim));
  });
  const out = [header]; let kept = 0, updated = 0, removed = 0;
  const seenOurs = new Set();
  body.forEach(line => {
    if (!line.trim()){ out.push(line); return; }
    const f = (parseCSV(line, delim)[0] || [])[sIdx] || '';
    const code = f.trim();
    if (ours.has(code)){ if (!seenOurs.has(code)){ updated++; seenOurs.add(code); } return; }
    if (prune && /^dm26[A-Za-z0-9]{8}$/.test(code)){ removed++; return; }
    out.push(line); kept++;
  });
  ours.forEach(row => out.push(row));
  return { text:(bom ? '﻿' : '') + out.join(eol) + eol, kept, updated, added:ours.size - updated, removed };
}
function exportFullCSV(){
  const rows = [CSV_COLUMNS].concat(sortedBinders().map(binderToCsvRow));
  const name = 'docmap_full_backup.csv';
  download(name, '﻿' + toCSV(rows, ';'), 'text/csv');
  markExported(name); toast(t('ex_done', {f:name}));
}
function workspaceJSON(){
  return JSON.stringify({ app:'DocMap26', format:'docmap_workspace', version:APP_VERSION, exported_at:nowISO(),
    settings:S.settings, lang:S.lang, print:S.print, customPresets:S.customPresets, usedSlots:S.usedSlots, binders:S.binders }, null, 2);
}
function exportJSON(){
  const name = 'docmap_workspace.json';
  download(name, workspaceJSON(), 'application/json');
  markExported(name); toast(t('ex_done', {f:name}));
}
function quickBackup(){
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  const name = 'docmap_workspace_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + '.json';
  download(name, workspaceJSON(), 'application/json');
  markExported(name); toast(t('ex_done', {f:name}));
  $$('.overlay [data-a="quick-backup"]').forEach(b => { b.disabled = true; });
}

/* ---------------- AI prompt ---------------- */
function csvTemplateHeader(){ return 'speaking_code;company_name;category;binder_title;room_code;cabinet_code;shelf_code;sector_code;location_code;archive_state;contents;tags;color_hex;short_code;short_url;final_destination'; }
function buildAIPrompt(includeCtx){
  const F = '```';
  const codes = sortedBinders().map(b => b.speaking_code);
  const byPrefix = {};
  codes.forEach(c => { const m = c.match(/^([A-Z]+)(\d+)$/); if (m) byPrefix[m[1]] = Math.max(byPrefix[m[1]] || 0, +m[2]); });
  const clients = Array.from(new Set(S.binders.map(b => b.company_name + ' → ' + initialsOf(b.company_name)))).slice(0, 60);
  const L = [];
  L.push('###################################################################');
  L.push('### PART 1 — SYSTEM INSTRUCTIONS FOR THE AI (DocMap 2026 / DM26) ###');
  L.push('###################################################################');
  L.push('');
  L.push('ROLE: You are a meticulous archival data-entry assistant for an Italian accounting firm (studio commercialista / CPA firm). Convert the user\'s notes, lists or photos (PART 2, written in Italian) into rows for "DocMap 2026", a physical-digital archive of binders (faldoni / cartelle).');
  L.push('');
  L.push('OUTPUT RULES (MANDATORY — follow exactly):');
  L.push('1. Reply with EXACTLY ONE fenced code block labelled csv and NOTHING ELSE: no greeting, no explanation, no notes before or after the block.');
  L.push('2. Delimiter: semicolon ( ; ). Encoding: UTF-8. The FIRST line must be this exact header, unchanged:');
  L.push(csvTemplateHeader());
  L.push('3. Every row must have exactly 16 fields (15 semicolons). Keep empty fields empty (e.g. ";;").');
  L.push('4. One row per physical binder. Never merge two binders into one row and never split one binder into two rows.');
  L.push('5. Never use a semicolon inside a value (replace it with a comma). Do not wrap values in quotes. No line breaks inside values.');
  L.push('6. Do not invent clients, documents or locations that the user did not provide or that are not visible in the photos. If a field is unknown, leave it empty.');
  L.push('');
  L.push('FIELD RULES:');
  L.push('- speaking_code: client initials + progressive number per client. Initials = first letter of up to 3 significant words, ignoring legal forms (S.r.l., S.p.A., S.n.c., S.a.s.) and words like "di", "e", "della". Examples: "Barbieri Luigi S.r.l." → BL1, BL2, BL3; "Rossi Costruzioni S.p.A." → RC1; "Farmacia San Giorgio" → FSG1. Uppercase, no spaces, unique.');
  L.push('- company_name: full client / company name exactly as the user wrote it.');
  L.push('- category: choose the closest of: ' + CATEGORIES.join(', ') + '.');
  L.push('- binder_title: short macro title of the binder in Italian (e.g. "Fatture e Contabilità IVA", "Bilancio e Dichiarativi", "Paghe e Personale").');
  L.push('- room_code: room/zone letter (A, B, S…). cabinet_code: cabinet number (1, 2, 3…).');
  L.push('- shelf_code: shelf identifier. Use Greek letters from the top shelf downwards: α, β, γ, δ, ε (or R1, R2… / letters if the user uses them).');
  L.push('- sector_code: optional horizontal sector: SX (left), CX (centre), DX (right). Leave empty if unknown.');
  L.push('- location_code: room_code + cabinet_code + "-" + shelf_code, plus "-" + sector_code when present. Examples: A1-α, B2-β-SX.');
  L.push('- archive_state: CURRENT (archivio corrente), HISTORICAL (archivio storico), CHECKED_OUT (in uso / prelevato). Default: CURRENT.');
  L.push('- contents: the documents inside the binder, pipe-separated, each as "YEAR: Description". Example: 2025: Fatture Acquisto Q1-Q4|2025: Liquidazioni IVA|2024: Bilancio d\'esercizio');
  L.push('- tags: comma-separated lowercase keywords without spaces (e.g. iva,fatture,bilancio,2025).');
  L.push('- color_hex: by category → Ordinaria #2563EB, Semplificata #059669, Lavoro #D97706, Societario #7C3AED, Dichiarativi #DC2626, any other #475569.');
  L.push('- short_code: PREFERABLY LEAVE EMPTY — DocMap generates a unique code automatically. If you fill it, it must be "dm26" + exactly 8 characters from A-Z a-z 2-9, excluding I O l o (example: dm26K8m2P9xL), unique in the file.');
  L.push('- short_url: leave empty if short_code is empty, otherwise https://qr7.it/{short_code}.');
  L.push('- final_destination: leave EMPTY (DocMap fills it from the studio template).');
  L.push('');
  if (includeCtx && codes.length){
    L.push('EXISTING ARCHIVE CONTEXT (do NOT reuse these speaking codes; continue numbering after them):');
    L.push('- Codes already in use: ' + codes.join(', '));
    L.push('- Next free numbers: ' + Object.keys(byPrefix).sort().map(p => p + (byPrefix[p] + 1)).join(', '));
    L.push('- Known clients → initials: ' + clients.join('; '));
    L.push('');
  }
  L.push('EXAMPLE OF A VALID REPLY (format only — use the user\'s real data):');
  L.push(F + 'csv');
  L.push(csvTemplateHeader());
  L.push('BL4;Barbieri Luigi S.r.l.;Ordinaria;Banche e Finanziamenti;A;1;γ;;A1-γ;CURRENT;2025: Estratti conto bancari|2025: Contratti di finanziamento;banche,finanziamenti,2025;#2563EB;;;');
  L.push('VR1;Verdi Rita;Privati;Dichiarazioni Personali;B;3;α;SX;B3-α-SX;HISTORICAL;2023: Modello 730|2024: Modello 730|2024: Spese mediche;730,privati,dichiarazioni;#475569;;;');
  L.push(F);
  L.push('');
  L.push('');
  L.push('===================================================================');
  L.push('🇮🇹 INSERISCI QUI SOTTO LE INFORMAZIONI, LE FOTO O L\'ELENCO DEI FALDONI DA GENERARE:');
  L.push('(Specifica: Nomi clienti, documenti contenuti, stanze/armadi ed eventuali allegati)');
  L.push('===================================================================');
  L.push('[Scrivi o incolla qui le tue note e allega le foto degli scaffali/documenti...]');
  L.push('');
  return L.join('\n');
}

/* ---------------- Archive ---------------- */
function stateBadge(s){ const c = s === 'CURRENT' ? 'b-current' : s === 'HISTORICAL' ? 'b-historical' : 'b-out'; return '<span class="badge ' + c + '">' + esc(t('s_' + s)) + '</span>'; }
function filteredBinders(){

  return sortedBinders().filter(b => {
    if (UI.fState && b.archive_state !== UI.fState) return false;
    if (UI.fRoom && b.room_code !== UI.fRoom) return false;

    return q.split(/\s+/).every(w => hay.indexOf(w) >= 0);

}
function viewArchive(){
  const rooms = Array.from(new Set(S.binders.map(b => b.room_code).filter(Boolean))).sort(naturalCmp);
  const cats = Array.from(new Set(S.binders.map(b => b.category).filter(Boolean))).sort(naturalCmp);

      sel('fCat', t('all_cats'), cats.map(c => [c, c]), UI.fCat) +

function shelfOrder(s){ const i = GREEK.indexOf(s); return i >= 0 ? 'a' + i : 'b' + s; }
function shelfMapHTML(list){
  const rooms = {};
  const unplaced = [];
  list.forEach(b => {
    if (!b.room_code && !b.cabinet_code && !b.shelf_code){ unplaced.push(b); return; }
    const r = b.room_code || '?', c = b.cabinet_code || '?', s = b.shelf_code || '?';
    ((rooms[r] = rooms[r] || {})[c] = rooms[r][c] || {})[s] = (rooms[r][c][s] || []).concat(b);
  });
  const spine = (b) => '<button class="spine ' + (b.archive_state === 'CHECKED_OUT' ? 'out' : '') + '" style="background:' + esc(b.color_hex) + '" data-a="edit" data-id="' + b.id + '" title="' + esc(b.speaking_code + ' — ' + b.company_name + ' — ' + b.binder_title + (b.sector_code ? ' — ' + b.sector_code : '')) + '">' + esc(b.speaking_code) + '</button>';
  let h = '<div class="map-rooms">';
  Object.keys(rooms).sort(naturalCmp).forEach(r => {
    const cabs = rooms[r];
    const n = Object.values(cabs).reduce((a, c) => a + Object.values(c).reduce((x, y) => x + y.length, 0), 0);
    h += '<div class="room"><div class="room-h"><span>' + esc((S.lang === 'en' ? 'Room ' : 'Stanza ') + r) + '</span><span class="mono small">' + n + '</span></div>';
    Object.keys(cabs).sort(naturalCmp).forEach(c => {
      h += '<div class="cab"><div class="cab-h">' + esc((S.lang === 'en' ? 'Cabinet ' : 'Armadio ') + r + c) + '</div>';
      Object.keys(cabs[c]).sort((a, b) => naturalCmp(shelfOrder(a), shelfOrder(b))).forEach(s => {
        const items = cabs[c][s].slice().sort((a, b) => naturalCmp(({SX:0,CX:1,DX:2})[a.sector_code] ?? 3, ({SX:0,CX:1,DX:2})[b.sector_code] ?? 3) || naturalCmp(a.speaking_code, b.speaking_code));
        h += '<div class="shelf"><div class="shelf-l">' + esc(r + c + '-' + s) + '</div><div class="shelf-b">' + items.map(spine).join('') + '</div></div>';
      });
      h += '</div>';
    });
    h += '</div>';
  });
  if (unplaced.length) h += '<div class="room"><div class="room-h" style="background:#64748B"><span>' + esc(t('unplaced')) + '</span><span class="mono small">' + unplaced.length + '</span></div><div class="cab"><div class="shelf-b">' + unplaced.map(spine).join('') + '</div></div></div>';
  return h + '</div>';
}

function analyzeImport(text){
  let s = String(text || '').replace(/^﻿/, '').trim();
  if (!s){ UI.importParsed = null; return; }
  const fence = s.match(/```[a-zA-Z]*\s*\n([\s\S]*?)```/);
  if (fence) s = fence[1].trim();
  let records = [], format = 'CSV', delim = '', workspace = null;
  if (/^[\[{]/.test(s)){
    format = 'JSON';
    let obj; try { obj = JSON.parse(s); } catch(e){ UI.importParsed = {error:'JSON: ' + e.message}; return; }
    if (Array.isArray(obj)) records = obj;
    else if (obj && Array.isArray(obj.binders)){ records = obj.binders; workspace = obj; format = 'JSON workspace'; }
    else if (obj && Array.isArray(obj.rows)) records = obj.rows;
    else if (obj && Array.isArray(obj.data)) records = obj.data;
    else if (obj && typeof obj === 'object') records = [obj];
  } else {
    delim = detectDelim(s);
    const rows = parseCSV(s, delim).filter(r => r.some(c => String(c).trim()));
    if (rows.length < 2){ UI.importParsed = {error:t('im_none')}; return; }
    const head = rows[0].map(h => h.trim());
    records = rows.slice(1).map(r => { const o = {}; head.forEach((h, i) => { o[h] = r[i] != null ? r[i] : ''; }); return o; });
  }
  const plannedCodes = [], plannedSC = [], byCode = new Map(S.binders.map(b => [b.speaking_code.toUpperCase(), b]));
  const seenInFile = new Set();
  const rows = [];
  records.forEach((raw, idx) => {
    const p = mapRecord(raw), w = [];
    if (!p.company_name && !(p.speaking_code && byCode.has(p.speaking_code))){ rows.push({idx, status:'err', p, w:[t('im_w_skip')]}); return; }
    if (!p.speaking_code){ p.speaking_code = suggestSpeakingCode(p.company_name, plannedCodes); w.push(t('im_w_code')); }
    if (seenInFile.has(p.speaking_code)){ const old = p.speaking_code; p.speaking_code = suggestSpeakingCode(p.company_name || old, plannedCodes.concat(Array.from(seenInFile))); w.push(old + ' → ' + p.speaking_code); }
    seenInFile.add(p.speaking_code); plannedCodes.push(p.speaking_code);
    const match = byCode.get(p.speaking_code) || null;
    // short code
    const taken = allShortCodes(match ? match.id : null);
    plannedSC.forEach(x => taken.add(x));
    if (p.short_code && !SC_RE.test(p.short_code)){ delete p.short_code; }
    if (p.short_code && taken.has(p.short_code)){ delete p.short_code; w.push(t('im_w_sc_dup')); }
    if (!p.short_code){
      if (match && match.short_code && !plannedSC.includes(match.short_code)) p._keepSC = match.short_code;
      else { p.short_code = newShortCode(plannedSC); w.push(t('im_w_sc')); }
    }
    plannedSC.push(p.short_code || p._keepSC);
    if (p.color_hex && !normHex(p.color_hex)){ delete p.color_hex; w.push(t('im_w_color')); }
    else if (!p.color_hex && !match){ p.color_hex = CAT_COLOR[p.category] || '#475569'; }
    if (p.id && S.binders.some(b => b.id === p.id && (!match || b.id !== match.id))) delete p.id;
    rows.push({idx, status: match ? 'upd' : 'new', p, w, match: match ? match.id : null});
  });
  UI.importParsed = { rows, format, delim, workspace };
}

function applyImport(mode){
  const IP = UI.importParsed; if (!IP || !IP.rows) return;
  const rows = IP.rows.filter(r => r.status !== 'err');
  let added = 0, updated = 0;
  const now = nowISO();
  const strip = (p) => { const o = clone(p); const keep = o._keepSC; delete o._keepSC; return [o, keep]; };
  if (mode === 'replace'){
    const old = new Map(S.binders.map(b => [b.id, b]));
    S.binders = rows.map(r => {
      const [p, keep] = strip(r.p);
      const base = r.match ? {id:r.match, short_code:keep || old.get(r.match).short_code, created_at:old.get(r.match).created_at} : {};
      const b = normalizeBinder(Object.assign({updated_at:now}, base, p));
      if (!b.short_code) b.short_code = keep || newShortCode();
      b.short_url = shortUrl(b.short_code);
      r.match ? updated++ : added++;
      return b;
    });
    if (IP.workspace && UI.restoreAll){
      const W = IP.workspace;
      if (W.settings) S.settings = Object.assign(defaultState().settings, W.settings);
      if (W.print) S.print = Object.assign(defaultState().print, W.print, {geometry:Object.assign(geoFromPreset(BUILTIN_PRESETS[0]), (W.print || {}).geometry || {})});
      if (Array.isArray(W.customPresets)) S.customPresets = W.customPresets;
      if (W.usedSlots && typeof W.usedSlots === 'object') S.usedSlots = W.usedSlots;
      if (W.lang === 'it' || W.lang === 'en') S.lang = W.lang;
      // workspace JSON keeps original timestamps
      rows.forEach((r, i) => { if (r.p.updated_at) S.binders[i].updated_at = r.p.updated_at; });
    }
  } else {
    rows.forEach(r => {
      const [p, keep] = strip(r.p);
      if (r.match){
        const i = S.binders.findIndex(b => b.id === r.match);
        const cur = S.binders[i];
        delete p.id;
        const merged = Object.assign({}, cur, p, {updated_at: p.updated_at || now});
        if (!p.short_code) merged.short_code = keep || cur.short_code;

  toast(t('im_done', {a:added, u:updated}), 'ok', 5000);
  S.view = 'archive'; UI.q = ''; savePrefs(); renderAll();
}
