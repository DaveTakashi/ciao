<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocMap 2026 — Phygital Archive &amp; Precision Label Studio</title>
<meta name="description" content="DocMap 2026 (DM26): archivio fisico-digitale, mappatura scaffali, stampa millimetrica di etichette con QR qr7.it, database SQLite locale. Funziona offline con doppio clic.">
<link rel="stylesheet" href="assets/docmap.css">
<link rel="stylesheet" href="assets/css-info.css">
<link rel="stylesheet" href="assets/css-editor.css">
<link rel="stylesheet" href="assets/css-import.css">
<link rel="stylesheet" href="assets/css-labels.css">

<style id="page-style">@page{size:210mm 297mm;margin:0mm}</style>

<body>
<div id="banner-root"></div>
<header class="topbar"><div class="topbar-in" id="topbar"></div></header>
<main id="view"></main>
<div id="modal-root"></div>
<div id="help-root"></div>
<div id="guide-root"></div>
<div id="toasts"></div>
<div id="print-root"></div>
<input type="file" id="file-import" accept=".xlsx,.xlsm,.xls,.csv,.json,.txt,text/csv,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" class="hidden">
<input type="file" id="file-manifest" accept=".csv,.txt,text/csv" class="hidden">
<input type="file" id="file-restore" accept=".json,application/json" class="hidden">
<input type="file" id="file-sqlite" accept=".sqlite,.sqlite3,.db,application/x-sqlite3,application/vnd.sqlite3" class="hidden">
<noscript><div style="padding:40px;font-family:sans-serif">DocMap 2026 richiede JavaScript attivo. / DocMap 2026 requires JavaScript.</div></noscript>
